config-version: 2

name: "jaffle_shop"
version: "3.0.0"
require-dbt-version: ">=2.0.0"

profile: civis-studio # Put your profile here

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["data-tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  jaffle_shop:
    +schema: raw
    jaffle-data:
      +enabled: "{{ var('load_source_data', false) }}"

models:
  jaffle_shop:
    staging:
      +materialized: view
      # Start with strict analysis on your cleanest models
      +static_analysis: strict
    marts:
      +materialized: table
      # Keep baseline for models that need more work
      +static_analysis: baseline
