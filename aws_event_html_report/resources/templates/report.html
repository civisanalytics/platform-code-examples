<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ report_title }}</title>
  <link rel="stylesheet" href="resources/static/styles.css">
</head>
<body>

  <header class="report-header">
    <h1>{{ report_title }}</h1>
    {% if report_subtitle %}<p class="report-subtitle">{{ report_subtitle }}</p>{% endif %}
  </header>

  <main class="report-body">
    {% for child_html in children %}
      {{ child_html | safe }}
    {% endfor %}
  </main>

  <footer class="report-footer">
    <p>Generated by report_builder.py</p>
  </footer>

</body>
</html>
